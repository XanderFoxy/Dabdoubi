<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elefantoubi - Connected Logic</title>
    <style>
        :root { --pink: #ff2a6d; --bg: #050505; --ui-bg: rgba(15, 15, 15, 0.98); --neon-shadow: 0 0 15px rgba(255, 42, 109, 0.8); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { background:var(--bg); color:white; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        
        header { text-align:center; padding:20px; background:#000; border-bottom: 1px solid #222; position: sticky; top:0; z-index:100; }
        h1 { color:var(--pink); font-size:1.6rem; letter-spacing:5px; text-transform: uppercase; margin-bottom: 15px; }
        
        .tabs { display:flex; gap:10px; justify-content:center; flex-wrap: wrap; }
        .tabs button { padding:12px 18px; background:#1a1a1a; color:#ccc; border:1px solid #333; border-radius:8px; font-size:0.9rem; cursor:pointer; font-weight: bold; transition: 0.2s; }
        .tabs button.active { border-color: var(--pink); color: var(--pink); box-shadow: var(--neon-shadow); background: rgba(255,42,109,0.1); }

        .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; padding:15px; padding-bottom: 100px; }
        .item { aspect-ratio:9/16; background:#111; border-radius:12px; overflow:hidden; position:relative; border: 1px solid #222; }
        .item img, .item video { width:100%; height:100%; object-fit:cover; }
        
        .item-actions { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:8px; z-index:10; }
        .action-btn { font-size:1.3rem; filter: drop-shadow(0 0 5px black); cursor: pointer; }

        .modal { display:none; position:fixed; inset:0; background:#000; z-index:1000; flex-direction: column; overflow: hidden !important; }
        .modal.active { display:flex; }
        .media-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden !important; width: 100%; height: 100%; }
        
        #modal-img, #modal-video { max-width: 100%; max-height: 100%; object-fit: contain; display: none; }

        /* SKALIERUNGS-MODI FÜR INTEGRATION VON BILD- UND VIDEOINHALTEN */
        #modal-video.fit-cover, #modal-img.fit-cover {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            object-fit: cover !important;
        }
        #modal-video.fit-fill, #modal-img.fit-fill {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            max-height: none !important;
            object-fit: fill !important;
        }

        /* TRANSITION FÜR AUTOMATISCHE UI-AUSBLENDUNG */
        #video-zoom-btn, #rotation-tip-btn, .player-panel {
            transition: opacity 0.3s ease, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            opacity: 1;
        }

        /* FIXIERTER ZOOM STEUERUNGS BUTTON */
        #video-zoom-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1250;
            cursor: pointer;
            color: white;
        }

        /* PASSIVER ROTATIONS-TIPP-KREISEL BUTTON */
        #rotation-tip-btn {
            position: fixed;
            top: 20px;
            right: 72px;
            width: 42px;
            height: 42px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1250;
            cursor: pointer;
            color: #00fff0;
            box-shadow: 0 0 10px rgba(0, 255, 240, 0.3);
            pointer-events: none; /* Dient rein als visueller Hinweis */
        }

        .burger-trigger { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            width: 60px; height: 60px; background: var(--pink); border-radius: 50%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
            z-index: 1100; box-shadow: var(--neon-shadow); border: none;
        }
        .burger-trigger span { width: 25px; height: 2px; background: white; border-radius: 1px; }

        .player-panel { 
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 400px; background: var(--ui-bg); border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.1); padding: 20px; z-index: 1050;
            display: none; flex-direction: column; gap: 20px; box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        .player-panel.show { display: flex; animation: slideIn 0.2s ease-out; }

        .slider-row { width: 100%; }
        .slider-row label { font-size: 0.7rem; color: #888; display: block; text-align: center; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #333; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: white; border: 2px solid var(--pink); box-shadow: var(--neon-shadow); }

        .btn-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: white; font-size: 1.6rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-btn.active { color: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
        .v-badge { font-size: 0.7rem; color: var(--pink); border: 1px solid var(--pink); padding: 2px 5px; border-radius: 4px; font-weight: bold; }

        @keyframes slideIn { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
    <div class="tabs">
        <button onclick="setMainFilter('all')" id="tab-all" class="active">Alle</button>
        <button onclick="setMainFilter('image')" id="tab-image">Bilder</button>
        <button onclick="setMainFilter('video')" id="tab-video">Videos</button>
        <button onclick="setSubFilter('favs')" id="tab-fav">❤️ Favoriten</button>
        <button onclick="setSubFilter('daily')" id="tab-daily">🔖 Heute</button>
    </div>
</header>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="media-container" id="modal-media" onclick="toggleUI()">
        <img id="modal-img">
        <video id="modal-video" playsinline></video>
    </div>
    
    <button id="rotation-tip-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-2.19"/><text x="12" y="15.5" font-size="11" font-family="-apple-system, sans-serif" font-weight="bold" fill="currentColor" stroke="none" text-anchor="middle">!</text></svg>
    </button>
    <button id="video-zoom-btn" onclick="cycleVideoZoom(event)"></button>

    <button class="burger-trigger" onclick="toggleUI()"><span></span><span></span><span></span></button>
    <div class="player-panel" id="ui-panel">
        <div class="slider-row">
            <label id="speed-label">Intervall: 5.0s</label>
            <input type="range" id="speed-slider" min="500" max="12000" value="5000" step="100" oninput="document.getElementById('speed-label').innerText='Intervall: '+(this.value/1000).toFixed(1)+'s'">
        </div>
        <div class="btn-row">
            <button class="nav-btn" onclick="prevMedia()">❮</button>
            <button class="nav-btn" onclick="toggleShuffle()" id="shuffle-btn">🎲</button>
            <button class="nav-btn" onclick="toggleSlideshow()" id="play-btn">▶</button>
            <button class="nav-btn" onclick="toggleVideoSpeed()"><span class="v-badge" id="v-speed-txt">1x</span></button>
            <button class="nav-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
            <button class="nav-btn" onclick="closeModal()">✕</button>

let favs = JSON.parse(localStorage.getItem('eb_favs')) || [];
let daily = JSON.parse(localStorage.getItem('eb_daily')) || [];
let mainFilter = 'all'; 
let subFilter = 'none'; 
let currentList = [];
let currentIndex = 0;
let isMuted = localStorage.getItem('eb_mute') === 'true';
let isSlideshow = false;
let isShuffle = false;
let videoSpeed = 1.0;
let slideTimer = null;
let uiTimeoutTimer = null;

let currentZoomMode = 0;

function renderGallery() {
    const g = document.getElementById('gallery');
    g.innerHTML = '';
    currentList = media.filter(src => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const matchesMain = mainFilter === 'all' || (mainFilter === 'video' && isVid) || (mainFilter === 'image' && !isVid);
        let matchesSub = true;
        if(subFilter === 'favs') matchesSub = favs.includes(src);
        if(subFilter === 'daily') matchesSub = daily.includes(src);
        return matchesMain && matchesSub;
    });

    currentList.forEach((src, idx) => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
            ${isVid ? `<video src="${src}#t=0.1" muted playsinline preload="metadata"></video>` : `<img src="${src}">`}
            <div class="item-actions">
                <span class="action-btn" onclick="toggleAction('${src}', 'favs', event)">${favs.includes(src)?'❤️':'♡'}</span>
                <span class="action-btn" onclick="toggleAction('${src}', 'daily', event)">${daily.includes(src)?'🔖':'➕'}</span>
            </div>
        `;
        div.onclick = () => openModal(idx);
        g.appendChild(div);
    });
}

function setMainFilter(f) {
    mainFilter = f;
    updateTabStyles();
    renderGallery();
}

function setSubFilter(s) {
    subFilter = (subFilter === s) ? 'none' : s; 
    updateTabStyles();
    renderGallery();
}

function updateTabStyles() {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + mainFilter).classList.add('active');
    if(subFilter !== 'none') {
        const subId = (subFilter === 'favs') ? 'tab-fav' : 'tab-daily';
        document.getElementById(subId).classList.add('active');
    }
}

function openModal(idx) {
    currentIndex = idx;
    const m = document.getElementById('modal');
    const imgEl = document.getElementById('modal-img');
    const vidEl = document.getElementById('modal-video');
    const zoomBtn = document.getElementById('video-zoom-btn');
    const src = currentList[currentIndex];
    const isVid = src.match(/\.(mp4|mov)$/i);
    clearTimeout(slideTimer);
    
    zoomBtn.style.display = 'flex'; 
    imgEl.classList.remove('fit-cover', 'fit-fill');
    imgEl.style.display = 'none';
    vidEl.classList.remove('fit-cover', 'fit-fill');
    vidEl.style.display = 'none';
    
    if(isVid) {
        vidEl.style.display = 'block';
        vidEl.muted = isMuted;
        vidEl.volume = isMuted ? 0 : 1.0;
        
        const absoluteSrc = new URL(src, window.location.href).href;
        if(vidEl.src !== absoluteSrc) {
            vidEl.src = src;
        }
        
        vidEl.onloadedmetadata = () => {
            vidEl.playbackRate = videoSpeed;
            checkOrientationAndTip();
            applyZoomViewLogic();
        };
        if (vidEl.readyState >= 1) {
            checkOrientationAndTip();
            applyZoomViewLogic();
        }
        
        vidEl.loop = !isSlideshow; 
        vidEl.onended = () => { 
            if(isSlideshow) nextMedia();
        };
        
        vidEl.play().then(() => {
            vidEl.playbackRate = videoSpeed;
        }).catch(() => {});
    } else {
        vidEl.pause();
        imgEl.src = src;
        imgEl.style.display = 'block';
        
        imgEl.onload = () => {
            checkOrientationAndTip();
            applyZoomViewLogic();
        };
        if(imgEl.complete) {
            checkOrientationAndTip();
            applyZoomViewLogic();
        }
        
        if(isSlideshow) slideTimer = setTimeout(nextMedia, document.getElementById('speed-slider').value);
    }
    
    m.classList.add('active');
    startInactivityTracker();
    updateUI();
}

function checkOrientationAndTip() {
    const tipBtn = document.getElementById('rotation-tip-btn');
    const imgEl = document.getElementById('modal-img');
    const vidEl = document.getElementById('modal-video');
    if (!tipBtn) return;
    
    let medW = 0, medH = 0;
    if (vidEl.style.display === 'block') {
        medW = vidEl.videoWidth;
        medH = vidEl.videoHeight;
    } else if (imgEl.style.display === 'block') {
        medW = imgEl.naturalWidth;
        medH = imgEl.naturalHeight;
    }
    
    if (!medW || !medH || medW === medH) {
        tipBtn.style.display = 'none';
        return;
    }
    
    const isMediaLandscape = medW > medH;
    const isScreenLandscape = window.innerWidth > window.innerHeight;
    
    // Tipp-Kreisel erscheint NUR bei einem Format-Mismatch
    if (isMediaLandscape !== isScreenLandscape) {
        tipBtn.style.display = 'flex';
    } else {
        tipBtn.style.display = 'none';
    }
}

function cycleVideoZoom(e) {
    if(e) e.stopPropagation();
    currentZoomMode = (currentZoomMode + 1) % 3;
    applyZoomViewLogic();
}

function applyZoomViewLogic() {
    const vidEl = document.getElementById('modal-video');
    const imgEl = document.getElementById('modal-img');
    const el = vidEl.style.display === 'block' ? vidEl : imgEl;
    if (!el) return;
    
    vidEl.classList.remove('fit-cover', 'fit-fill');
    imgEl.classList.remove('fit-cover', 'fit-fill');
    
    if (currentZoomMode === 1) el.classList.add('fit-cover');
    if (currentZoomMode === 2) el.classList.add('fit-fill');
    
    updateZoomButtonUI();
    checkOrientationAndTip();
}

function updateZoomButtonUI() {
    const btn = document.getElementById('video-zoom-btn');
    if(!btn) return;
    
    if(currentZoomMode === 0) {
        btn.style.color = 'white';
        btn.style.borderColor = 'rgba(255, 255, 255, 0.2)';
        btn.style.boxShadow = 'none';
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>';
    } else if(currentZoomMode === 1) {
        btn.style.color = 'var(--pink)';
        btn.style.borderColor = 'var(--pink)';
        btn.style.boxShadow = 'var(--neon-shadow)';
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1" fill="currentColor"/></svg>';
    } else if(currentZoomMode === 2) {
        btn.style.color = '#00fff0';
        btn.style.borderColor = '#00fff0';
        btn.style.boxShadow = '0 0 15px rgba(0, 255, 240, 0.8)';
        
        // RECHTECK-SYMBOL: Passt sich dynamisch an die aktuelle Haltung des Bildschirms an
        const isPortrait = window.innerWidth < window.innerHeight;
        if(isPortrait) {
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="7" y="2" width="10" height="20" rx="1.5"/></svg>';
        } else {
            btn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="7" width="20" height="10" rx="1.5"/></svg>';
        }
    }
}

/* INTERAKTIVES AUTO-HIDE-SYSTEM (BLENDED RESSOURCEN NACH 2 SEKUNDEN INAKTIVITÄT AUS) */
function startInactivityTracker() {
    const modal = document.getElementById('modal');
    
    const triggerReset = () => {
        const zoomBtn = document.getElementById('video-zoom-btn');
        const tipBtn = document.getElementById('rotation-tip-btn');
        const uiPanel = document.getElementById('ui-panel');
        const vidEl = document.getElementById('modal-video');
        
        if(zoomBtn && vidEl.style.display === 'block') zoomBtn.style.opacity = '1';
        if(tipBtn && tipBtn.style.display === 'flex') tipBtn.style.opacity = '1';
        if(uiPanel) uiPanel.style.opacity = '1';
        
        clearTimeout(uiTimeoutTimer);
        uiTimeoutTimer = setTimeout(() => {
            if (document.activeElement && document.activeElement.id === 'speed-slider') return;
            
            if(zoomBtn) zoomBtn.style.opacity = '0';
            if(tipBtn) tipBtn.style.opacity = '0';
            if(uiPanel && !uiPanel.classList.contains('show')) {
                uiPanel.style.opacity = '0';
            }
        }, 2000);
    };

    modal.addEventListener('mousemove', triggerReset);
    modal.addEventListener('touchstart', triggerReset);
    modal.addEventListener('mousedown', triggerReset);
    modal.addEventListener('click', triggerReset);
    
    triggerReset();
}

window.addEventListener('resize', function() {
    checkOrientationAndTip();
    applyZoomViewLogic();
});

function nextMedia() {
    if(!currentList.length) return;
    if(isShuffle) currentIndex = Math.floor(Math.random() * currentList.length);
    else currentIndex = (currentIndex + 1) % currentList.length;
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    openModal(currentIndex);
}

function toggleAction(src, list, e) {
    e.stopPropagation();
    if(list === 'favs') {
        if(favs.includes(src)) favs = favs.filter(s => s !== src);
        else favs.push(src);
        localStorage.setItem('eb_favs', JSON.stringify(favs));
    } else {
        if(daily.includes(src)) daily = daily.filter(s => s !== src);
        else daily.push(src);
        localStorage.setItem('eb_daily', JSON.stringify(daily));
    }
    renderGallery();
}

function toggleUI() { document.getElementById('ui-panel').classList.toggle('show'); }
function toggleSlideshow() { isSlideshow = !isSlideshow; if(isSlideshow) nextMedia(); else clearTimeout(slideTimer); updateUI(); }
function toggleShuffle() { isShuffle = !isShuffle; updateUI(); }

function toggleMute() { 
    isMuted = !isMuted; 
    localStorage.setItem('eb_mute', isMuted); 
    const vidEl = document.getElementById('modal-video');
    if(vidEl) {
        vidEl.muted = isMuted;
        vidEl.volume = isMuted ? 0 : 1.0;
    }
    updateUI(); 
}

function toggleVideoSpeed() { 
    videoSpeed = videoSpeed >= 2.0 ? 1.0 : videoSpeed + 0.5;
    const vidEl = document.getElementById('modal-video');
    if(vidEl) {
        vidEl.playbackRate = videoSpeed; 
    }
    document.getElementById('v-speed-txt').innerText = videoSpeed + 'x'; 
}

function updateUI() {
    document.getElementById('play-btn').innerText = isSlideshow ? '⏸' : '▶';
    document.getElementById('play-btn').classList.toggle('active', isSlideshow);
    document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
}

function closeModal() {
    clearTimeout(uiTimeoutTimer);
    document.getElementById('modal').classList.remove('active');
    const vidEl = document.getElementById('modal-video');
    vidEl.pause();
    vidEl.src = ''; 
    clearTimeout(slideTimer);
    isSlideshow = false;
    currentZoomMode = 0; 
    updateUI();
}

renderGallery();
</script>
</body>
</html>
