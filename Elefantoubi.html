<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elefantoubi</title>
    <style>
        :root { --pink: #ff2a6d; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; color:white; font-family:system-ui, sans-serif; min-height:100vh; }
        header { text-align:center; padding:25px 0; background:rgba(0,0,0,0.95); position:sticky; top:0; z-index:100; }
        h1 { color:var(--pink); font-size:2.4rem; letter-spacing:2px; }

        .controls {
            padding:15px;
            display:flex;
            flex-wrap:wrap;
            gap:12px;
            justify-content:center;
            background:#111;
        }
        button {
            padding:12px 20px;
            background:#1f1f1f;
            color:white;
            border:none;
            border-radius:50px;
            font-size:1.05rem;
            cursor:pointer;
        }
        button.active, button:hover { background:var(--pink); }

        .gallery {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(165px, 1fr));
            gap:12px;
            padding:15px;
            max-width:1400px;
            margin:0 auto;
        }
        .item {
            aspect-ratio:9/16;
            background:#111;
            border-radius:14px;
            overflow:hidden;
            position:relative;
            cursor:pointer;
            box-shadow:0 6px 20px rgba(0,0,0,0.6);
        }
        .item:hover { transform:scale(1.05); transition:0.3s; }
        .item img, .item video { width:100%; height:100%; object-fit:cover; }
        .favorite {
            position:absolute;
            top:12px; right:12px;
            font-size:1.8rem;
            cursor:pointer;
            z-index:10;
            text-shadow:0 2px 8px rgba(0,0,0,0.8);
        }

        .modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.98);
            z-index:1000;
            align-items:center;
            justify-content:center;
        }
        .modal.active { display:flex; }
        .modal-content { max-width:96%; max-height:96%; position:relative; }
        .modal-content video, .modal-content img { max-width:100%; max-height:92vh; border-radius:12px; }
        .close {
            position:absolute;
            top:-55px; right:10px;
            font-size:2.5rem;
            cursor:pointer;
            color:white;
        }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
</header>

<div class="controls">
    <button onclick="showAll()" class="active">Alle</button>
    <button onclick="showFavorites()">❤️ Favoriten</button>
    <button onclick="randomPlay()">▶ Zufällig abspielen</button>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="modal-media"></div>

</div>

let favorites = JSON.parse(localStorage.getItem('elefantoubi_favorites')) || [];

function renderGallery(items) {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    items.forEach(src => {
        const isVideo = src.endsWith('.mp4') || src.endsWith('.mov');
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
            ${isVideo ? `<video src="${src}" muted loop></video>` : `<img src="${src}" alt="" loading="lazy">`}
            <span class="favorite" onclick="toggleFavorite('${src}', event)">${favorites.includes(src) ? '❤️' : '♡'}</span>
        `;
        div.onclick = (e) => {
            if (!e.target.classList.contains('favorite')) showModal(src);
        };
        gallery.appendChild(div);
    });
}

function toggleFavorite(src, e) {
    e.stopImmediatePropagation();
    if (favorites.includes(src)) {
        favorites = favorites.filter(f => f !== src);
    } else {
        favorites.push(src);
    }
    localStorage.setItem('elefantoubi_favorites', JSON.stringify(favorites));
    renderGallery(media);
}

function showModal(src) {
    const modal = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const isVideo = src.endsWith('.mp4') || src.endsWith('.mov');

    container.innerHTML = isVideo ? 
        `<video src="${src}" controls autoplay loop></video>` : 
        `<img src="${src}" alt="">`;
    
    modal.classList.add('active');
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

function showAll() { renderGallery(media); }
function showFavorites() { renderGallery(favorites); }

function randomPlay() {
    const randomSrc = media[Math.floor(Math.random() * media.length)];
    showModal(randomSrc);
}

// Start
showAll();
