<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elefantoubi - Premium</title>
    <style>
        :root { --pink: #ff2a6d; --bg: #050505; --ui-bg: rgba(15, 15, 15, 0.95); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { background:var(--bg); color:white; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        
        header { text-align:center; padding:15px; background:#000; border-bottom: 1px solid #222; position: sticky; top:0; z-index:100; }
        h1 { color:var(--pink); font-size:1.2rem; letter-spacing:3px; text-transform: uppercase; margin-bottom: 10px; }
        .tabs { display:flex; gap:8px; justify-content:center; padding-bottom: 5px; }
        .tabs button { padding:8px 12px; background:#1a1a1a; color:#888; border:1px solid #333; border-radius:6px; font-size:0.75rem; cursor:pointer; }
        .tabs button.active { border-color: var(--pink); color: var(--pink); background: rgba(255,42,109,0.1); }

        .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; padding:15px; }
        .item { aspect-ratio:9/16; background:#111; border-radius:10px; overflow:hidden; position:relative; border: 1px solid #222; }
        .item img, .item video { width:100%; height:100%; object-fit:cover; }
        .fav-star { position:absolute; top:8px; right:8px; font-size:1.2rem; z-index:10; filter: drop-shadow(0 0 5px black); }

        .modal { display:none; position:fixed; inset:0; background:#000; z-index:1000; flex-direction: column; }
        .modal.active { display:flex; }
        .media-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px; }
        .media-container img, .media-container video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; }

        .menu-toggle { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--pink); color: white; width: 50px; height: 50px; border-radius: 25px; border: none; z-index: 1100; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; box-shadow: 0 0 15px var(--pink); opacity: 0.8; }
        
        .player-panel { 
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 380px; background: var(--ui-bg); border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1); padding: 15px; z-index: 1050;
            display: none; flex-direction: column; gap: 15px;
        }
        .player-panel.show { display: flex; animation: slideUp 0.3s ease; }

        .slider-row { width: 100%; text-align: center; }
        .slider-row label { font-size: 0.6rem; color: #888; display: block; margin-bottom: 5px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: #333; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 22px; width: 22px; border-radius: 11px; background: var(--pink); border: 2px solid white; cursor: pointer; }

        .btn-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: white; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; }
        .nav-btn.active { color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }
        .speed-val { font-size: 0.7rem; color: var(--pink); border: 1px solid var(--pink); padding: 2px 4px; border-radius: 3px; }

        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
    <div class="tabs">
        <button onclick="setFilter('all')" id="tab-all" class="active">Alle</button>
        <button onclick="setFilter('image')" id="tab-image">Bilder</button>
        <button onclick="setFilter('video')" id="tab-video">Videos</button>
        <button onclick="toggleFavView()" id="tab-fav">❤️ Favoriten</button>
    </div>
</header>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="media-container" id="modal-media" onclick="toggleUI()"></div>
    <button class="menu-toggle" id="ui-trigger" onclick="toggleUI()">⚙️</button>
    <div class="player-panel" id="ui-panel">
        <div class="slider-row">
            <label id="speed-label">Intervall: 5.0s</label>
            <input type="range" id="speed-slider" min="500" max="15000" value="5000" step="100" oninput="document.getElementById('speed-label').innerText='Intervall: '+(this.value/1000).toFixed(1)+'s'">
        </div>
        <div class="btn-row">
            <button class="nav-btn" onclick="prevMedia()">❮</button>
            <button class="nav-btn" onclick="toggleShuffle()" id="shuffle-btn">🎲</button>
            <button class="nav-btn" onclick="toggleSlideshow()" id="play-btn">▶</button>
            <button class="nav-btn" onclick="toggleVideoSpeed()" id="v-speed-btn"><span class="speed-val" id="v-speed-txt">1x</span></button>
            <button class="nav-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
            <button class="nav-btn" onclick="closeModal()">✕</button>
            <button class="nav-btn" onclick="nextMedia()">❯</button>
        </div>
    </div>
</div>

<script>

    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2012.mp4",

    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2019.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2020.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2023.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%20Let%20them%20fuck%20gently.mp4"
];

let favorites = JSON.parse(localStorage.getItem('favs_eb')) || [];
let currentFilter = 'all';
let showFavs = false;
let currentList = [];
let currentIndex = 0;
let isMuted = localStorage.getItem('mute_eb') === 'true';
let isSlideshow = false;
let isShuffle = false;
let videoSpeed = 1.0;
let timer = null;

function renderGallery() {
    const g = document.getElementById('gallery');
    g.innerHTML = '';
    currentList = media.filter(src => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const matchesType = currentFilter === 'all' || (currentFilter === 'video' && isVid) || (currentFilter === 'image' && !isVid);
        return matchesType && (!showFavs || favorites.includes(src));
    });
    currentList.forEach((src, idx) => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `${isVid ? `<video src="${src}#t=0.1" muted playsinline></video>` : `<img src="${src}">`}<span class="fav-star" onclick="toggleFavorite('${src}', event)">${favorites.includes(src)?'❤️':'♡'}</span>`;
        div.onclick = () => openModal(idx);
        g.appendChild(div);
    });
}

function openModal(idx) {
    currentIndex = idx;
    const m = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const src = currentList[currentIndex];
    const isVid = src.match(/\.(mp4|mov)$/i);
    clearTimeout(timer);
    container.innerHTML = isVid ? `<video id="player" src="${src}" autoplay playsinline></video>` : `<img src="${src}">`;
    m.classList.add('active');
    const v = document.getElementById('player');
    if(v) {
        v.muted = isMuted;
        v.playbackRate = videoSpeed;
        v.onended = () => nextMedia();
    } else if(isSlideshow) {
        timer = setTimeout(nextMedia, document.getElementById('speed-slider').value);
    }
    updateUI();
}

function nextMedia() {
    if(currentList.length === 0) return;
    if(isShuffle) currentIndex = Math.floor(Math.random() * currentList.length);
    else currentIndex = (currentIndex + 1) % currentList.length;
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    openModal(currentIndex);
}

function toggleUI() { document.getElementById('ui-panel').classList.toggle('show'); }
function toggleSlideshow() { isSlideshow = !isSlideshow; if(isSlideshow) nextMedia(); else clearTimeout(timer); updateUI(); }
function toggleShuffle() { isShuffle = !isShuffle; updateUI(); }
function toggleMute() { isMuted = !isMuted; localStorage.setItem('mute_eb', isMuted); if(document.getElementById('player')) document.getElementById('player').muted = isMuted; updateUI(); }
function toggleVideoSpeed() { videoSpeed = videoSpeed >= 2.0 ? 1.0 : videoSpeed + 0.5; if(document.getElementById('player')) document.getElementById('player').playbackRate = videoSpeed; document.getElementById('v-speed-txt').innerText = videoSpeed + 'x'; }

function updateUI() {
    document.getElementById('play-btn').innerText = isSlideshow ? '⏸' : '▶';
    document.getElementById('play-btn').classList.toggle('active', isSlideshow);
    document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
}

function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + type).classList.add('active');
    renderGallery();
}

function toggleFavView() { showFavs = !showFavs; document.getElementById('tab-fav').classList.toggle('active', showFavs); renderGallery(); }
function toggleFavorite(src, e) { e.stopPropagation(); if(favorites.includes(src)) favorites = favorites.filter(f => f !== src); else favorites.push(src); localStorage.setItem('favs_eb', JSON.stringify(favorites)); renderGallery(); }
function closeModal() { document.getElementById('modal').classList.remove('active'); document.getElementById('ui-panel').classList.remove('show'); clearTimeout(timer); isSlideshow = false; updateUI(); }

renderGallery();
</script>
</body>
</html>
