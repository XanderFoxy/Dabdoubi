<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elefantoubi - Professional</title>
    <style>
        :root { --pink: #ff2a6d; --bg: #050505; --ui-bg: rgba(15, 15, 15, 0.98); --neon-shadow: 0 0 15px rgba(255, 42, 109, 0.8); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { background:var(--bg); color:white; font-family: -apple-system, sans-serif; overflow-x: hidden; }
        
        /* ORIGINAL HEADER DESIGN */
        header { text-align:center; padding:20px; background:#000; border-bottom: 1px solid #222; position: sticky; top:0; z-index:100; }
        h1 { color:var(--pink); font-size:1.6rem; letter-spacing:5px; text-transform: uppercase; margin-bottom: 15px; text-shadow: 0 0 10px rgba(255,42,109,0.3); }
        
        .tabs { display:flex; gap:10px; justify-content:center; flex-wrap: wrap; }
        .tabs button { padding:12px 18px; background:#1a1a1a; color:#ccc; border:1px solid #333; border-radius:8px; font-size:0.9rem; cursor:pointer; font-weight: bold; }
        .tabs button.active { border-color: var(--pink); color: var(--pink); box-shadow: var(--neon-shadow); background: rgba(255,42,109,0.1); }

        /* GALERIE */
        .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; padding:15px; padding-bottom: 100px; }
        .item { aspect-ratio:9/16; background:#111; border-radius:12px; overflow:hidden; position:relative; border: 1px solid #222; }
        .item img, .item video { width:100%; height:100%; object-fit:cover; }
        
        .item-actions { position:absolute; top:8px; right:8px; display:flex; flex-direction:column; gap:8px; z-index:10; }
        .action-btn { font-size:1.3rem; filter: drop-shadow(0 0 5px black); cursor: pointer; }

        /* MODAL */
        .modal { display:none; position:fixed; inset:0; background:#000; z-index:1000; flex-direction: column; }
        .modal.active { display:flex; }
        .media-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .media-container img, .media-container video { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* BURGER MENU TRIGGER */
        .burger-trigger { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); 
            width: 60px; height: 60px; background: var(--pink); border-radius: 50%; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px;
            z-index: 1100; box-shadow: var(--neon-shadow); border: none;
        }
        .burger-trigger span { width: 25px; height: 3px; background: white; border-radius: 2px; transition: 0.3s; }

        /* PLAYER PANEL */
        .player-panel { 
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); 
            width: 92%; max-width: 400px; background: var(--ui-bg); border-radius: 25px; 
            border: 1px solid var(--pink); padding: 20px; z-index: 1050;
            display: none; flex-direction: column; gap: 20px; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        .player-panel.show { display: flex; animation: slideIn 0.2s ease-out; }

        .slider-row { width: 100%; }
        .slider-row label { font-size: 0.7rem; color: #888; display: block; text-align: center; margin-bottom: 10px; }
        input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: #333; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 26px; width: 26px; border-radius: 50%; background: var(--pink); border: 3px solid white; }

        .btn-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: white; font-size: 1.6rem; cursor: pointer; transition: 0.2s; min-width: 44px; }
        .nav-btn.active { color: var(--pink); filter: drop-shadow(0 0 10px var(--pink)); transform: scale(1.1); }
        .v-badge { font-size: 0.7rem; color: var(--pink); border: 1.5px solid var(--pink); padding: 2px 6px; border-radius: 5px; font-weight: bold; }

        @keyframes slideIn { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
    <div class="tabs">
        <button onclick="setFilter('all')" id="tab-all" class="active">Alle</button>
        <button onclick="setFilter('image')" id="tab-image">Bilder</button>
        <button onclick="setFilter('video')" id="tab-video">Videos</button>
        <button onclick="toggleView('favs')" id="tab-fav">❤️ Favoriten</button>
        <button onclick="toggleView('daily')" id="tab-daily">🔖 Heute</button>
    </div>
</header>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="media-container" id="modal-media" onclick="toggleUI()"></div>
    
    <button class="burger-trigger" onclick="toggleUI()">
        <span></span><span></span><span></span>
    </button>

    <div class="player-panel" id="ui-panel">
        <div class="slider-row">
            <label id="speed-label">Intervall: 5.0s</label>
            <input type="range" id="speed-slider" min="500" max="12000" value="5000" step="100" 
                   oninput="document.getElementById('speed-label').innerText='Intervall: '+(this.value/1000).toFixed(1)+'s'">
        </div>
        <div class="btn-row">
            <button class="nav-btn" onclick="prevMedia()">❮</button>
            <button class="nav-btn" onclick="toggleShuffle()" id="shuffle-btn">🎲</button>
            <button class="nav-btn" onclick="toggleSlideshow()" id="play-btn">▶</button>
            <button class="nav-btn" onclick="toggleVideoSpeed()"><span class="v-badge" id="v-speed-txt">1x</span></button>
            <button class="nav-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
            <button class="nav-btn" onclick="closeModal()">✕</button>
            <button class="nav-btn" onclick="nextMedia()">❯</button>
        </div>
    </div>
</div>

<script>
const media = [

    "Bilder/AsmaaUndAlexSex/IMG_3545.jpeg", "Bilder/AsmaaUndAlexSex/IMG_3602.jpeg",

    // VIDEOS (Exakte Pfade mit %20)
    "Videos/AsmaaUndAlexSex/fe0ae259a6f8e304433b267a7f3ae8c1.mp4",
    "Videos/AsmaaUndAlexSex/eac76931cc54bae1774dd031345aab4e.mov",
    "Videos/AsmaaUndAlexSex/e1237b68bfc375b12301bb7c4cde94ec.mov",
    "Videos/AsmaaUndAlexSex/a564327b6d14dff6378523b031df18f6.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%20%E2%80%9Eultra%20realistic%20image-to-video%20from%20the%20exact%20reference%20image.%208.mov",

    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2011.mp4",
    "Videos/AsmaaUndAlexSex/2a5e808e4d6985bec7c23964f63f2415.mp4",
    "Videos/AsmaaUndAlexSex/36a0e66c98b40e7413b4809cb7b9d1aa.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2010.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2012.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2018.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2019.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2020.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2023.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%20Let%20them%20fuck%20gently.mp4"
];

let favs = JSON.parse(localStorage.getItem('eb_favs')) || [];
let daily = JSON.parse(localStorage.getItem('eb_daily')) || [];
let filterType = 'all'; 
let viewMode = 'all'; // 'all', 'favs', 'daily'
let currentList = [];
let currentIndex = 0;
let isMuted = localStorage.getItem('eb_mute') === 'true';
let isSlideshow = false;
let isShuffle = false;
let videoSpeed = 1.0;
let slideTimer = null;

function renderGallery() {
    const g = document.getElementById('gallery');
    g.innerHTML = '';
    currentList = media.filter(src => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const matchesFilter = filterType === 'all' || (filterType === 'video' && isVid) || (filterType === 'image' && !isVid);
        const matchesView = viewMode === 'all' || (viewMode === 'favs' && favs.includes(src)) || (viewMode === 'daily' && daily.includes(src));
        return matchesFilter && matchesView;
    });

    currentList.forEach((src, idx) => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
            ${isVid ? `<video src="${src}#t=0.1" muted playsinline></video>` : `<img src="${src}">`}
            <div class="item-actions">
                <span class="action-btn" onclick="toggleAction('${src}', 'favs', event)">${favs.includes(src)?'❤️':'♡'}</span>
                <span class="action-btn" onclick="toggleAction('${src}', 'daily', event)">${daily.includes(src)?'🔖':'➕'}</span>
            </div>
        `;
        div.onclick = () => openModal(idx);
        g.appendChild(div);
    });
}

function openModal(idx) {
    currentIndex = idx;
    const m = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const src = currentList[currentIndex];
    const isVid = src.match(/\.(mp4|mov)$/i);
    
    // Clean-up gegen Geister-Sounds
    clearTimeout(slideTimer);
    container.innerHTML = ''; 

    const el = isVid ? document.createElement('video') : document.createElement('img');
    el.src = src;
    if(isVid) {
        el.id = 'player';
        el.autoplay = true;
        el.playsInline = true;
        el.muted = isMuted;
        el.playbackRate = videoSpeed;
        el.onended = () => { if(isSlideshow) nextMedia(); else el.play(); };
    }
    container.appendChild(el);
    m.classList.add('active');
    
    if(!isVid && isSlideshow) {
        slideTimer = setTimeout(nextMedia, document.getElementById('speed-slider').value);
    }
    updateUI();
}

function nextMedia() {
    if(!currentList.length) return;
    if(isShuffle) currentIndex = Math.floor(Math.random() * currentList.length);
    else currentIndex = (currentIndex + 1) % currentList.length;
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    openModal(currentIndex);
}

function toggleAction(src, list, e) {
    e.stopPropagation();
    let target = (list === 'favs') ? favs : daily;
    if(target.includes(src)) target = target.filter(s => s !== src);
    else target.push(src);
    
    if(list === 'favs') { favs = target; localStorage.setItem('eb_favs', JSON.stringify(favs)); }
    else { daily = target; localStorage.setItem('eb_daily', JSON.stringify(daily)); }
    renderGallery();
}

function setFilter(f) {
    filterType = f;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + f).classList.add('active');
    renderGallery();
}

function toggleView(v) {
    viewMode = (viewMode === v) ? 'all' : v;
    document.getElementById('tab-fav').classList.toggle('active', viewMode === 'favs');
    document.getElementById('tab-daily').classList.toggle('active', viewMode === 'daily');
    if(viewMode === 'all') document.getElementById('tab-all').classList.add('active');
    else document.getElementById('tab-all').classList.remove('active');
    renderGallery();
}

function toggleUI() { document.getElementById('ui-panel').classList.toggle('show'); }

function toggleSlideshow() {
    isSlideshow = !isSlideshow;
    if(isSlideshow) nextMedia();
    else clearTimeout(slideTimer);
    updateUI();
}

function toggleShuffle() { isShuffle = !isShuffle; updateUI(); }

function toggleMute() {
    isMuted = !isMuted;
    localStorage.setItem('eb_mute', isMuted);
    const p = document.getElementById('player');
    if(p) p.muted = isMuted;
    updateUI();
}

function toggleVideoSpeed() {
    videoSpeed = videoSpeed >= 2.0 ? 1.0 : videoSpeed + 0.5;
    const p = document.getElementById('player');
    if(p) p.playbackRate = videoSpeed;
    document.getElementById('v-speed-txt').innerText = videoSpeed + 'x';
}

function updateUI() {
    document.getElementById('play-btn').innerText = isSlideshow ? '⏸' : '▶';
    document.getElementById('play-btn').classList.toggle('active', isSlideshow);
    document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('modal-media').innerHTML = ''; // Zerstört Video-Instanz
    clearTimeout(slideTimer);
    isSlideshow = false;
    updateUI();
}

renderGallery();
</script>
</body>
</html>
