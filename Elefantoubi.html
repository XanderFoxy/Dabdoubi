<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elefantoubi - Premium Galerie</title>
    <style>
        :root { --pink: #ff2a6d; --glass: rgba(255, 255, 255, 0.1); --bg: #0a0a0a; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:white; font-family: 'Segoe UI', sans-serif; min-height:100vh; overflow-x: hidden; }
        
        header { text-align:center; padding:15px 0; background:rgba(0,0,0,0.9); position:sticky; top:0; z-index:100; border-bottom: 1px solid #222; }
        h1 { color:var(--pink); font-size:1.6rem; letter-spacing:4px; text-transform: uppercase; }

        .controls {
            padding:12px; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
            background:#111; border-bottom: 1px solid #222;
        }
        
        button {
            padding:8px 16px; background:#1f1f1f; color:white; border:1px solid #333;
            border-radius:6px; font-size:0.85rem; cursor:pointer; transition: 0.3s;
        }
        button.active { background: transparent; border-color: var(--pink); color: var(--pink); box-shadow: inset 0 0 8px var(--pink); }
        button:hover { background: var(--pink); color: white; }

        .gallery {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
            gap:12px; padding:15px; max-width:1400px; margin:0 auto;
        }
        
        .item {
            aspect-ratio:9/16; background:#161616; border-radius:10px; overflow:hidden;
            position:relative; cursor:pointer; transition: 0.3s; border: 1px solid #222;
        }
        .item:hover { transform:scale(1.02); border-color: var(--pink); }
        .item img, .item video { width:100%; height:100%; object-fit:cover; display: block; }
        
        .favorite {
            position:absolute; top:8px; right:8px; font-size:1.3rem; z-index:10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.9)); cursor: pointer;
        }

        /* Modal Player */
        .modal {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.98);
            z-index:1000; flex-direction: column; align-items:center; justify-content:center;
        }
        .modal.active { display:flex; }
        
        .modal-content { 
            position:relative; width: 95%; max-width: 450px;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .media-container {
            width: 100%; background: #000; border-radius: 12px; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); border: 1px solid var(--glass);
            position: relative; aspect-ratio: 9/16; display: flex; align-items: center;
        }
        
        .media-container img, .media-container video {
            width: 100%; height: 100%; object-fit: contain;
        }

        .player-nav {
            background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(15px);
            padding: 12px; border-radius: 12px; border: 1px solid var(--glass);
            display: flex; flex-direction: column; gap: 10px;
        }

        .nav-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }

        .nav-btn {
            background: none; border: none; color: white; font-size: 1.4rem;
            cursor: pointer; padding: 5px; transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .nav-btn:hover { color: var(--pink); }
        .nav-btn.active { color: var(--pink); filter: drop-shadow(0 0 5px var(--pink)); }

        /* Speed Slider */
        .speed-ctrl { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: #888; width: 100%; }
        .speed-ctrl input { flex: 1; accent-color: var(--pink); cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
</header>

<div class="controls">
    <button onclick="setFilter('all')" class="active" id="btn-all">Alle</button>
    <button onclick="setFilter('image')">Bilder</button>
    <button onclick="setFilter('video')">Videos</button>
    <button onclick="toggleFavView()" id="btn-fav">❤️ Favoriten</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div class="media-container" id="modal-media"></div>
        
        <div class="player-nav">
            <div class="nav-row">
                <button class="nav-btn" onclick="prevMedia()">❮</button>
                <button class="nav-btn" onclick="toggleShuffle()" id="shuffle-btn">🎲</button>
                <button class="nav-btn" onclick="toggleSlideshow()" id="play-btn">▶</button>
                <button class="nav-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
                <button class="nav-btn" onclick="closeModal()">✕</button>
                <button class="nav-btn" onclick="nextMedia()">❯</button>
            </div>
            <div class="speed-ctrl">
                <span>Langsam</span>
                <input type="range" id="speed-slider" min="2000" max="15000" value="5000" step="500">
                <span>Schnell</span>
            </div>
        </div>
    </div>
</div>

<script>

];

let favorites = JSON.parse(localStorage.getItem('elefantoubi_favorites')) || [];
let isMuted = localStorage.getItem('elefantoubi_muted') !== 'false'; // Standard: Muted
let currentFilter = 'all'; 
let showFavsOnly = false;
let currentIndex = 0;
let currentList = [];
let slideshowTimer = null;
let isSlideshowActive = false;
let isShuffleActive = false;

function fixUrl(path) {
    return path.split('/').map(part => encodeURIComponent(part)).join('/');
}

function renderGallery() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';
    currentList = media.filter(src => {
        const isVideo = src.toLowerCase().match(/\.(mp4|mov)$/);
        const matchesType = currentFilter === 'all' || (currentFilter === 'video' && isVideo) || (currentFilter === 'image' && !isVideo);
        const matchesFav = !showFavsOnly || favorites.includes(src);
        return matchesType && matchesFav;
    });
    currentList.forEach((src, index) => {
        const isVideo = src.toLowerCase().match(/\.(mp4|mov)$/);
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `
            ${isVideo ? `<video src="${fixUrl(src)}#t=0.1" preload="metadata" muted></video>` : `<img src="${fixUrl(src)}" loading="lazy">`}
            <span class="favorite" onclick="toggleFavorite('${src}', event)">${favorites.includes(src) ? '❤️' : '♡'}</span>
        `;
        div.onclick = (e) => { if (!e.target.classList.contains('favorite')) { currentIndex = index; showModal(src); } };
        gallery.appendChild(div);
    });
}

function showModal(src) {
    const modal = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const isVideo = src.toLowerCase().match(/\.(mp4|mov)$/);
    clearTimeout(slideshowTimer);

    // Video oder Bild im Frame einbetten
    container.innerHTML = isVideo ? 
        `<video id="mainVideo" src="${fixUrl(src)}" autoplay playsinline></video>` : 
        `<img src="${fixUrl(src)}">`;
    
    modal.classList.add('active');
    
    const v = document.getElementById('mainVideo');
    if(v) {
        v.muted = isMuted;
        // Wenn Video endet -> Nächstes Medium wenn Diashow an, sonst Loop
        v.onended = () => { 
            if(isSlideshowActive) nextMedia(); 
            else v.play(); 
        };
    } else if(isSlideshowActive) {
        // Bei Bildern: Wartezeit laut Slider
        const speed = document.getElementById('speed-slider').value;
        slideshowTimer = setTimeout(nextMedia, speed);
    }
    updateUI();
}

function nextMedia() {
    if(currentList.length === 0) return;
    if(isShuffleActive) {
        currentIndex = Math.floor(Math.random() * currentList.length);
    } else {
        currentIndex = (currentIndex + 1) % currentList.length;
    }
    showModal(currentList[currentIndex]);
}

function prevMedia() {
    if(currentList.length === 0) return;
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    showModal(currentList[currentIndex]);
}

function toggleMute() {
    isMuted = !isMuted;
    localStorage.setItem('elefantoubi_muted', isMuted);
    const v = document.getElementById('mainVideo');
    if(v) v.muted = isMuted;
    updateUI();
}

function toggleSlideshow() {
    isSlideshowActive = !isSlideshowActive;
    if(isSlideshowActive) nextMedia();
    else clearTimeout(slideshowTimer);
    updateUI();
}

function toggleShuffle() {
    isShuffleActive = !isShuffleActive;
    updateUI();
}

function updateUI() {
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
    document.getElementById('play-btn').classList.toggle('active', isSlideshowActive);
    document.getElementById('shuffle-btn').classList.toggle('active', isShuffleActive);
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('modal-media').innerHTML = '';
    clearTimeout(slideshowTimer);
    isSlideshowActive = false;
    updateUI();
}

function setFilter(type) {
    currentFilter = type; showFavsOnly = false;
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderGallery();
}

function toggleFavView() {
    showFavsOnly = !showFavsOnly;
    document.getElementById('btn-fav').classList.toggle('active', showFavsOnly);
    renderGallery();
}

function toggleFavorite(src, e) {
    e.stopPropagation();
    if (favorites.includes(src)) favorites = favorites.filter(f => f !== src);
    else favorites.push(src);
    localStorage.setItem('elefantoubi_favorites', JSON.stringify(favorites));
    renderGallery();
}

// Start
renderGallery();
</script>
</body>
</html>
