<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elefantoubi - Galerie</title>
    <style>
        :root { --pink: #ff2a6d; --glass: rgba(255, 255, 255, 0.1); }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0a0a0a; color:white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; min-height:100vh; overflow-x: hidden; }
        
        header { text-align:center; padding:20px 0; background:rgba(0,0,0,0.95); position:sticky; top:0; z-index:100; border-bottom: 1px solid #222; }
        h1 { color:var(--pink); font-size:2rem; letter-spacing:3px; text-transform: uppercase; }

        .controls {
            padding:15px;
            display:flex;
            flex-wrap:wrap;
            gap:10px;
            justify-content:center;
            background:#111;
            border-bottom: 1px solid #222;
        }
        
        button {
            padding:10px 18px;
            background:#1f1f1f;
            color:white;
            border:1px solid #333;
            border-radius:8px;
            font-size:0.9rem;
            cursor:pointer;
            transition: 0.3s;
        }
        button.active, button:hover { background:var(--pink); border-color: var(--pink); }

        .gallery {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
            gap:15px;
            padding:20px;
            max-width:1400px;
            margin:0 auto;
        }
        
        .item {
            aspect-ratio:9/16;
            background:#161616;
            border-radius:12px;
            overflow:hidden;
            position:relative;
            cursor:pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid #222;
        }
        .item:hover { transform:scale(1.03); z-index: 5; border-color: var(--pink); }
        .item img, .item video { width:100%; height:100%; object-fit:cover; display: block; }
        
        .favorite {
            position:absolute;
            top:8px; right:8px;
            font-size:1.5rem;
            z-index:10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
            cursor: pointer;
        }

        /* Modal / Player */
        .modal {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.98);
            z-index:1000;
            flex-direction: column;
            align-items:center;
            justify-content:center;
        }
        .modal.active { display:flex; }
        
        .modal-content { 
            position:relative;
            width: 95%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .media-container {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            border: 1px solid var(--glass);
        }
        
        .media-container img, .media-container video {
            width: 100%;
            max-height: 75vh;
            display: block;
            margin: auto;
            object-fit: contain;
        }

        .player-nav {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 12px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border: 1px solid var(--glass);
        }

        .nav-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 5px 15px;
            transition: 0.2s;
        }
        .nav-btn:hover { color: var(--pink); transform: scale(1.1); }
    </style>
</head>
<body>

<header>
    <h1>Elefantoubi</h1>
</header>

<div class="controls">
    <button onclick="setFilter('all')" id="btn-all" class="active">Alle</button>
    <button onclick="setFilter('image')">Bilder</button>
    <button onclick="setFilter('video')">Videos</button>
    <button onclick="toggleFavView()" id="btn-fav">❤️ Favoriten</button>
    <button onclick="randomPlay()">🎲 Zufall</button>
</div>

<div class="gallery" id="gallery"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <div class="media-container" id="modal-media"></div>
        
        <div class="player-nav">
            <button class="nav-btn" onclick="prevMedia()">❮</button>
            <button class="nav-btn" id="mute-btn" onclick="toggleMute()">🔇</button>
            <button class="nav-btn" onclick="closeModal()" style="font-size: 0.9rem; font-weight: bold; letter-spacing: 1px;">CLOSE</button>
            <button class="nav-btn" onclick="nextMedia()">❯</button>
        </div>
    </div>
</div>

<script>

    "Videos/AsmaaUndAlexSex/cd1059fb87ba09e7f9cd6146e932e72b.mov",

    "Videos/AsmaaUndAlexSex/eac76931cc54bae1774dd031345aab4e.mov",
    "Videos/AsmaaUndAlexSex/e1237b68bfc375b12301bb7c4cde94ec.mov",

    "Videos/AsmaaUndAlexSex/Image to video | 8-second ultra realistic image-to-video from the exact referenc 23.mp4"
];

let favorites = JSON.parse(localStorage.getItem('elefantoubi_favorites')) || [];
let currentFilter = 'all'; 
let showFavsOnly = false;
let currentIndex = 0;
let currentList = [];

// URL-Encoding für Leerzeichen und Sonderzeichen
function fixUrl(path) {
    return path.split('/').map(part => encodeURIComponent(part)).join('/');
}

function renderGallery() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    currentList = media.filter(src => {
        const isVideo = src.toLowerCase().endsWith('.mp4') || src.toLowerCase().endsWith('.mov');
        const matchesType = currentFilter === 'all' || (currentFilter === 'video' && isVideo) || (currentFilter === 'image' && !isVideo);
        const matchesFav = !showFavsOnly || favorites.includes(src);
        return matchesType && matchesFav;
    });

    currentList.forEach((src, index) => {
        const isVideo = src.toLowerCase().endsWith('.mp4') || src.toLowerCase().endsWith('.mov');
        const div = document.createElement('div');
        div.className = 'item';
        
        // #t=0.001 erzwingt Vorschaubild
        const displayUrl = isVideo ? fixUrl(src) + "#t=0.001" : fixUrl(src);

        div.innerHTML = `
            ${isVideo ? `<video src="${displayUrl}" preload="metadata" muted></video>` : `<img src="${displayUrl}" loading="lazy">`}
            <span class="favorite" onclick="toggleFavorite('${src}', event)">${favorites.includes(src) ? '❤️' : '♡'}</span>
        `;
        div.onclick = (e) => {
            if (!e.target.classList.contains('favorite')) {
                currentIndex = index;
                showModal(src);
            }
        };
        gallery.appendChild(div);
    });
}

function setFilter(type) {
    currentFilter = type;
    showFavsOnly = false;
    document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
    // Button-Highlighting
    if(event) event.target.classList.add('active');
    renderGallery();
}

function toggleFavView() {
    showFavsOnly = !showFavsOnly;
    document.getElementById('btn-fav').classList.toggle('active', showFavsOnly);
    renderGallery();
}

function toggleFavorite(src, e) {
    e.stopPropagation();
    if (favorites.includes(src)) {
        favorites = favorites.filter(f => f !== src);
    } else {
        favorites.push(src);
    }
    localStorage.setItem('elefantoubi_favorites', JSON.stringify(favorites));
    renderGallery();
}

function showModal(src) {
    const modal = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const isVideo = src.toLowerCase().endsWith('.mp4') || src.toLowerCase().endsWith('.mov');

    container.innerHTML = isVideo ? 
        `<video id="mainVideo" src="${fixUrl(src)}" autoplay loop></video>` : 
        `<img src="${fixUrl(src)}">`;
    
    modal.classList.add('active');
    updateMuteBtn();
}

function nextMedia() {
    currentIndex = (currentIndex + 1) % currentList.length;
    showModal(currentList[currentIndex]);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    showModal(currentList[currentIndex]);
}

function toggleMute() {
    const v = document.getElementById('mainVideo');
    if(v) {
        v.muted = !v.muted;
        updateMuteBtn();
    }
}

function updateMuteBtn() {
    const v = document.getElementById('mainVideo');
    const btn = document.getElementById('mute-btn');
    if(v) {
        btn.style.opacity = '1';
        btn.innerText = v.muted ? '🔇' : '🔊';
    } else {
        btn.style.opacity = '0';
    }
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('modal-media').innerHTML = '';
}

function randomPlay() {
    currentIndex = Math.floor(Math.random() * currentList.length);
    if(currentList.length > 0) showModal(currentList[currentIndex]);
}

// Start
renderGallery();
</script>
</body>
</html>
