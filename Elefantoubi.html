<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elefantoubi - Frame Control</title>
    <style>
        :root { --pink: #ff2a6d; --bg: #050505; --ui-bg: rgba(25, 25, 25, 0.95); }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { background:var(--bg); color:white; font-family: -apple-system, sans-serif; overflow: hidden; }
        
        /* Galerie Ansicht */
        .gallery-wrap { height: 100vh; overflow-y: auto; padding: 15px; padding-bottom: 100px; }
        .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; }
        .item { aspect-ratio:9/16; background:#111; border-radius:12px; overflow:hidden; position:relative; border: 1px solid #222; }
        .item img, .item video { width:100%; height:100%; object-fit:cover; }

        /* Modal / Frame */
        .modal { display:none; position:fixed; inset:0; background:#000; z-index:1000; flex-direction: column; }
        .modal.active { display:flex; }
        
        .media-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; position: relative; width: 100%; }
        .media-container img, .media-container video { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Navigations-Frame (Höher platziert für Daumen-Bedienung) */
        .player-ui {
            position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: var(--ui-bg); backdrop-filter: blur(20px);
            padding: 20px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .slider-box { width: 100%; }
        .slider-box label { display: block; font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: #333; height: 6px; border-radius: 3px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%; background: var(--pink); box-shadow: 0 0 10px var(--pink); border: 2px solid white; }

        .btn-row { display: flex; justify-content: space-between; align-items: center; }
        .nav-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; transition: 0.2s; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        
        /* Aktiver Zustand: Nur Icon-Leuchten, kein pinkes Viereck */
        .nav-btn.active { color: var(--pink); filter: drop-shadow(0 0 8px var(--pink)); }
        
        .video-speed-badge { font-size: 0.7rem; color: var(--pink); border: 1px solid var(--pink); padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="gallery-wrap">
    <div class="gallery" id="gallery"></div>
</div>

<div class="modal" id="modal">
    <div class="media-container" id="modal-media"></div>
    
    <div class="player-ui">
        <div class="slider-box">
            <label id="speed-label">Wechsel-Intervall: 5s</label>
            <input type="range" id="speed-slider" min="2000" max="15000" value="5000" step="500" oninput="updateSpeedLabel(this.value)">
        </div>

        <div class="btn-row">
            <button class="nav-btn" onclick="prevMedia()">❮</button>
            <button class="nav-btn" onclick="toggleShuffle()" id="shuffle-btn">🎲</button>
            <button class="nav-btn" onclick="toggleSlideshow()" id="play-btn">▶</button>
            <button class="nav-btn" onclick="toggleVideoSpeed()" id="speed-btn" title="Video Tempo">
                <span class="video-speed-badge" id="v-speed-txt">1x</span>
            </button>
            <button class="nav-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
            <button class="nav-btn" onclick="closeModal()">✕</button>
            <button class="nav-btn" onclick="nextMedia()">❯</button>
        </div>
    </div>
</div>

    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2012.mp4",

    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%208-second%20ultra%20realistic%20image-to-video%20from%20the%20exact%20referenc%2023.mp4",
    "Videos/AsmaaUndAlexSex/Image%20to%20video%20%E4%B8%A8%20Let%20them%20fuck%20gently.mp4"
];

let currentIndex = 0;
let isMuted = localStorage.getItem('v_muted') === 'true';
let isSlideshow = false;
let isShuffle = false;
let videoSpeed = 1.0;
let timer = null;

function renderGallery() {
    const g = document.getElementById('gallery');
    media.forEach((src, idx) => {
        const isVid = src.match(/\.(mp4|mov)$/i);
        const div = document.createElement('div');
        div.className = 'item';
        // Nutze den Pfad direkt ohne zusätzliche Kodierung, da er bereits kodiert ist
        div.innerHTML = isVid ? `<video src="${src}#t=0.1" muted playsinline></video>` : `<img src="${src}">`;
        div.onclick = () => openModal(idx);
        g.appendChild(div);
    });
}

function openModal(idx) {
    currentIndex = idx;
    const modal = document.getElementById('modal');
    const container = document.getElementById('modal-media');
    const src = media[currentIndex];
    const isVid = src.match(/\.(mp4|mov)$/i);
    
    clearTimeout(timer);
    
    // playsinline ist wichtig, damit das Video im Browser-Frame bleibt
    container.innerHTML = isVid ? 
        `<video id="player" src="${src}" autoplay playsinline></video>` : 
        `<img src="${src}">`;
        
    modal.classList.add('active');
    
    const v = document.getElementById('player');
    if(v) {
        v.muted = isMuted;
        v.playbackRate = videoSpeed;
        v.onended = () => { if(isSlideshow) nextMedia(); else v.play(); };
    } else if(isSlideshow) {
        timer = setTimeout(nextMedia, document.getElementById('speed-slider').value);
    }
    updateUI();
}

function nextMedia() {
    if(isShuffle) {
        currentIndex = Math.floor(Math.random() * media.length);
    } else {
        currentIndex = (currentIndex + 1) % media.length;
    }
    openModal(currentIndex);
}

function prevMedia() {
    currentIndex = (currentIndex - 1 + media.length) % media.length;
    openModal(currentIndex);
}

function toggleSlideshow() {
    isSlideshow = !isSlideshow;
    if(isSlideshow) nextMedia();
    else clearTimeout(timer);
    updateUI();
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    updateUI();
}

function toggleMute() {
    isMuted = !isMuted;
    localStorage.setItem('v_muted', isMuted);
    const v = document.getElementById('player');
    if(v) v.muted = isMuted;
    updateUI();
}

function toggleVideoSpeed() {
    videoSpeed = videoSpeed >= 2.0 ? 1.0 : videoSpeed + 0.5;
    const v = document.getElementById('player');
    if(v) v.playbackRate = videoSpeed;
    document.getElementById('v-speed-txt').innerText = videoSpeed + 'x';
}

function updateUI() {
    document.getElementById('play-btn').innerText = isSlideshow ? '⏸' : '▶';
    document.getElementById('play-btn').classList.toggle('active', isSlideshow);
    document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    document.getElementById('mute-btn').innerText = isMuted ? '🔇' : '🔊';
}

function updateSpeedLabel(val) {
    document.getElementById('speed-label').innerText = `Wechsel-Intervall: ${val/1000}s`;
}

function closeModal() {
    document.getElementById('modal').classList.remove('active');
    document.getElementById('modal-media').innerHTML = '';
    clearTimeout(timer);
    isSlideshow = false;
    updateUI();
}

renderGallery();
</script>
</body>
</html>
